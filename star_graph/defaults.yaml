# NeuroWeave Cortex (NWC) — default hyperparameters
# v1.2.0 config system — every neuroscience mechanism is tunable

version: "1.3.1"

# ── Storage paths ──
# Default save location is ~/.star_graph/memory.json (JSON)
# or ~/.star_graph/memory.db (SQLite). Snapshots go to
# ~/.star_graph/snapshots/. Override by passing a path to
# MemoryManager(storage_path="...") or mgr.save("...").
storage:
  json: "~/.star_graph/memory.json"
  sqlite: "~/.star_graph/memory.db"
  snapshots: "~/.star_graph/snapshots"

# ── Memory Tiering (STM/MTM/LTM/Core) ──
tier:
  stm_max_items: 100
  stm_ttl_hours: 2.0
  mtm_max_topics: 2000
  ltm_max_summaries: 500
  core_max_entries: 50
  stm_to_mtm_threshold: 0.3
  mtm_to_ltm_threshold: 0.5
  ltm_to_core_threshold: 0.7

anchor:
  default_importance: 0.5
  default_frequency: 0.0
  default_recency: 1.0
  default_emotional_valence: 0.0
  default_stability: 0.0
  default_surprise: 0.5
  default_hippocampal_dependency: 1.0
  max_text_length: 280

  retention:
    # v0.4 additive weights (kept for backward compat, v0.5 multiplicative model
    # uses the factors below directly in retention_score)
    importance_weight: 0.25
    frequency_weight: 0.20
    recency_weight: 0.20
    stability_weight: 0.15
    surprise_weight: 0.10
    cortical_weight: 0.10
    rehearsing_boost: 1.3
    ghost_penalty: 0.3
    reactivated_penalty: 0.7
    # v0.5 multiplicative decay — half-life in days for natural decay factor
    decay_half_life_days: 30

  decay:
    base_half_life_hours: 168.0
    ghost_half_life_factor: 0.3
    dormant_half_life_factor: 1.5
    reactivated_half_life_factor: 0.7

  consolidation:
    strengthen_threshold: 0.15
    update_threshold: 0.50
    strengthen_importance_delta: 0.10
    strengthen_stability_delta: 0.30
    update_stability_delta: -0.15
    reconsolidation_stability_factor: 0.7

  state_entry:
    consolidating_stability_boost: 0.1
    dormant_min_stability: 0.7
    reactivated_stability: 0.2
    reactivated_surprise: 0.8
    activation_frequency_boost: 0.05

  oscillator:
    default_frequency: 0.5
    default_phase: 0.0
    default_coupling: 0.3
    default_damping: 0.1
    coupling_base: 0.25
    coupling_emotion_factor: 0.15
    critical_width_factor: 0.15

sleep:
  auto_micro_interval_hours: 1.0    # auto-trigger micro_consolidate every N hours
  auto_full_interval_hours: 24.0    # auto-trigger full sleep every N hours
  auto_anchor_threshold: 100        # auto-trigger micro when N new anchors since last

  swr:
    valence_weight: 0.25
    surprise_weight: 0.25
    frequency_weight: 0.20
    centrality_weight: 0.15
    instability_weight: 0.15
    top_fraction: 0.5
    sample_fraction: 0.33

  systems:
    tau: 20.0
    min_hippocampal_dep: 0.05
    schema_stability_threshold: 0.8
    schema_text_threshold: 100
    temporal_edge_weaken: 0.015
    topical_edge_strengthen: 0.01
    cortical_stability_factor: 0.9

  emotional:
    decay: 0.75
    strip_stability_threshold: 0.5
    importance_min_factor: 0.97
    importance_emotional_residual: 0.25
    importance_baseline: 0.15

  schema:
    min_instances: 3
    min_similarity: 0.6

  merge:
    default_threshold: 0.85
    importance_blend: 0.7
    stability_boost: 0.15
    min_tag_overlap: 1

  prune:
    default_retention_threshold: 0.15
    default_edge_threshold: 0.1
    contradiction_penalty: 0.2
    residual_edge_factor: 0.3
    ghost_stale_days: 30

  bridge:
    min_score: 0.6
    default_weight: 0.3

  hebbian:
    strengthen_delta: 0.03
    decay_log_factor: 0.02
    active_window_hours: 24
    max_decay: 0.1

  homeostasis:
    target_mean: 0.3
    scale_blend: 0.5

  # ── Sleep Rebuild (N3d) ──
  rebuild_fuse_threshold: 0.85      # cosine threshold for multi-node fusion
  rebuild_min_cluster: 3            # minimum anchors to form a fusion cluster
  rewire_drop_threshold: 0.05       # edges below this weight with 0 co-activation → drop
  rewire_strengthen_min_coact: 3    # co-activation count to trigger strengthen
  rewire_transitive_min_weight: 0.6 # minimum edge weight for transitive closure
  rewire_transitive_decay: 0.7      # decay factor for transitive edge weight
  abstractive_min_group: 4          # minimum anchors to form an abstractive pattern
  abstractive_decay_factor: 0.6     # how much to decay concrete anchors after abstraction
  dynamic_cluster_coact: 5          # co-activation threshold to auto-form clusters

  edge_formation:
    emotion_weight_boost: 0.3

retrieval:
  # ── Cross-Encoder Reranking ──
  rerank:
    enabled: false                    # opt-in; adds ~50ms for 10 pairs on CPU
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    top_k: 10                         # max candidates to rerank from RRF fusion
    threshold: 0.0                    # min cross-encoder score (0=keep all)

  oscillation:
    phase_weight: 0.3
    default_frequency: 0.5
    magnitude_base: 0.4
    magnitude_variance_factor: 0.6
    frequency_base: 0.3
    frequency_centroid_factor: 0.7

  spreading:
    steps: 3
    decay: 0.6
    min_edge_weight: 0.05
    resonance_weight: 0.6
    activation_weight: 0.4
    resonance_map_bonus: 0.7
    min_score_threshold: 0.05

  cortical:
    top_k: 10

  constellation:
    max_size: 20
    min_edge_weight: 0.1

ghost:
  compressed_dim: 16
  initial_reactivation_prob: 0.5
  emotion_attenuation: 0.6
  emotion_resonance_threshold: 0.2
  emotion_bonus_factor: 0.15
  min_effective_prob: 0.05
  revival_stability_boost: 0.2
  resonance_persistence: 0.01

  partial_recall:
    confidence_factor: 0.3
    decay_per_call: 0.1
    min_confidence: 0.05

  decay:
    half_life_days: 60
    purge_prob_threshold: 0.01
    purge_no_revival_days: 90

  resonance:
    default_threshold: 0.5
    fuzzy_threshold: 0.2
    fuzzy_sub_factor: 0.3

  active_threshold: 0.1

abstraction:
  min_cluster_size: 3
  similarity_threshold: 0.55
  stable_confidence: 0.7

competition:
  suppression_radius: 2.0
  base_suppression: 0.1
  emotional_boost_threshold: 0.5
  emotional_suppression_boost: 1.3
  winner_stability_factor: 0.5
  winner_recency_factor: 0.3
  edge_weaken_factor: 0.5
  competitor_threshold: 0.2
  tag_weight: 0.3
  embedding_weight: 0.5
  graph_weight: 0.2
  interference_threshold: 0.7
  interference_importance_factor: 0.7
  interference_stability_factor: 0.8
  rif_similarity_threshold: 0.5
  rif_factor: 0.05
  rif_stability_factor: 0.3

graph:
  contradiction_threshold: 0.7
  max_edges_per_node: 32
  max_degree_total: 24
  edge_budget_enabled: true
  max_total_anchors: 50000          # hard cap — evicts when exceeded (0 = disabled)
  eviction_policy: "lowest_retention"  # lru | fifo | lowest_retention
  spreading:
    default_steps: 3
    default_decay: 0.6
    min_weight: 0.05
  ghost_revival_threshold: 0.75

working_memory:
  max_capacity: 15
  ttl_seconds: 3600.0

exact_cache:
  max_entries_per_key: 5
  auto_harvest: true
  harvest_on_remember: true

cortex:
  default_token_budget: 2000
  default_decay_half_life_days: 30
  default_retention_threshold: 0.15
  max_anchors_before_consolidate: 1000
  consolidate_interval_hours: 24.0

routing:
  max_cortices: 3
  min_score: 0.1
  route_semantic_weight: 0.6
  route_keyword_weight: 0.3
  route_recency_weight: 0.1

gate:
  k: 20
  lateral_inhibition_radius: 0.7
  inhibition_strength: 0.3
  w_importance: 0.20
  w_recency: 0.15
  w_emotional: 0.10
  w_semantic: 0.25
  w_causal: 0.10
  w_focus: 0.15
  w_novelty: 0.05

timespine:
  max_clusters_per_day: 10
  cluster_similarity_threshold: 0.5
  max_days_scan: 30
  max_clusters_scan: 20

cascade:
  max_depth: 5
  min_causal_strength: 0.2
  max_chains: 5

hippocampus:
  enabled: true                   # route new input through hippocampus before LTM
  l1_ttl_minutes: 30              # L1 instant buffer — raw text, no graph
  l2_ttl_hours: 24                # L2 short-term — lightweight vector + local edges
  l1_max_items: 50                # max items in L1 before eviction
  l2_max_items: 200               # max items in L2 before eviction
  promote_threshold: 3             # access count needed to promote L1→L2

hub:
  leaf_stability: 0.9
  domain_stability: 0.95
  global_stability: 0.99
  max_degree_per_shard: 50
  shard_split_min_size: 8
  shard_split_clusters: 3
  shard_routing_top_k: 2

raw_buffer:
  max_sessions: 2               # keep last N sessions uncompressed
  max_chunks_per_session: 500   # cap per session to bound memory
  bm25_weight: 0.5              # weight of BM25 vs vector in raw search (0=vector only)
  merge_weight: 0.5             # weight of raw results in final merged ranking (0=graph only)

atom_facts:
  provider: template              # "openai", "anthropic", or "template" (offline)
  model: gpt-4o-mini              # model name (only used for openai/anthropic)
  min_cluster_size: 3             # minimum anchors in cluster to trigger extraction
  max_anchors_per_batch: 15       # max anchors sent to LLM per extraction
  min_fact_confidence: 0.4        # filter out facts below this confidence

dual_channel:
  s1_confidence_threshold: 0.35   # below this, System-2 auto-triggers
  s2_max_depth: 4                 # max traversal depth for hierarchical search
  merge_weight_s1: 0.4            # weight of System-1 in merged results
  merge_weight_s2: 0.6            # weight of System-2 in merged results
  auto_trigger_keywords: true     # auto-trigger on structural keywords (all/every/list/...)

community:
  max_community_size: 200
  min_community_size: 3
  max_iterations: 50
  intra_community_min_results: 5
  route_centroid_weight: 0.7

index:
  algorithm: "brute"
  metric: "cosine"
  n_trees: 10
  rebuild_on_adds: 50

snapshot:
  keep: 5                       # keep last N snapshots
  compress: true                # gzip-compress snapshot files
  auto_interval_hours: 6.0      # min hours between auto-snapshots

survival:
  function: ebbinghaus          # ebbinghaus, power_law, exponential, custom

  # Ebbinghaus params: S = min_hours + strength * (max_hours - min_hours)
  ebbinghaus_min_hours: 1.0
  ebbinghaus_max_hours: 336.0

  # Power-law params: R = (1 + t/S)^(-alpha)
  power_law_alpha: 0.5
  power_law_scale: 50.0

  # Exponential params: lambda per day
  exponential_lambda_per_day: 0.05

  # Ghost decay uses compressed S range (faster decay)
  ghost:
    ebbinghaus_min_factor: 0.2
    ebbinghaus_max_factor: 0.15
    base_strength_factor: 0.5

tracing:
  enabled: true                 # enable/disable all tracing
  max_traces: 100               # max traces to keep in memory

compression:
  episodic_token_limit: 150
  strategic_token_limit: 100
  meta_token_limit: 70
  min_cluster_size: 3
  similarity_threshold: 0.55
  max_source_anchors: 30
  source_retention_factor: 0.3
  summary_initial_stability: 0.85
  summary_hippocampal_dependency: 0.1

# ── Memory Revision Engine (#65) ──
revision:
  confidence_threshold: 0.35         # max confidence to flag for revision
  surprise_threshold: 0.7            # min surprise to flag for revision
  max_candidates: 50                 # max anchors to revise per sleep cycle
  similarity_threshold: 0.75         # cosine threshold for similar-anchor search
  strengthen_boost: 0.15             # stability boost for revised anchors
  llm_provider: template             # template | openai | anthropic (template=offline)

# ── Conflict Detection & Resolution (#63) ──
conflict:
  similarity_threshold: 0.85        # cosine threshold for semantic overlap
  sentiment_threshold: 0.3          # min |valence| to consider as biased
  overwrite_confidence: 0.7         # min confidence+stability for overwrite
  deprecate_retention: 0.2          # max retention to auto-deprecate old facts

# ── Cognitive Compiler (#45) ──
compiler:
  episodic_ratio: 0.20
  concept_ratio: 0.10
  worldview_ratio: 0.25
  min_worldview_confidence: 0.4
  min_worldview_evidence: 2
  worldview_half_life_days: 90.0
  similarity_threshold: 0.55
  max_worldviews: 20

# ── Self-Reflection Loop (#46) ──
reflection_loop:
  contradiction_threshold: 0.7
  min_confidence_gap: 0.15
  weaken_factor: 0.30
  ghost_on_correction: true
  max_reports: 100
  auto_revive_threshold: 0.3

# ── Graph-First Retrieval (#47) ──
graph_first:
  graph_weight: 0.6
  embedding_weight: 0.4
  max_depth: 2
  seed_count: 5

# ── Domain Router (#48) ──
domain_router:
  enabled: true
  route_semantic_weight: 0.6
  route_keyword_weight: 0.4
  depth_bonus: 0.3

# ── Edge Budget (#49) ──
edge_budget:
  max_edges: 32
  enforce_on_every_add: true

# ── Write Gate (#50) ──
write_gate:
  enabled: false                    # opt-in: enable to filter noise before storage
  min_importance: 0.15
  min_text_length: 8
  max_text_length: 4000
  duplicate_threshold: 0.92
  merge_threshold: 0.75
  noise_pattern_score: -0.3
  emotional_noise_threshold: 0.85
  debounce_window_seconds: 10.0

# ── Four-Layer Compression (#51) ──
four_layer:
  enabled: false                    # opt-in: enable for message→event→semantic→personality compression
  layer0:
    max_items: 500
    ttl_hours: 2.0
    compression_ratio: 0.2
  layer1:
    max_items: 200
    ttl_hours: 168.0
    compression_ratio: 0.15
  layer2:
    max_items: 50
    ttl_hours: 2160.0
    compression_ratio: 0.1
  layer3:
    max_items: 20
    ttl_hours: 0
    compression_ratio: 0.0

# ── Thermal Store (#53) ──
thermal_store:
  hot_to_cold_hours: 72.0            # idle hours before hot→cold demotion
  cold_to_archive_hours: 720.0       # idle hours before cold→archive
  promote_accesses: 2                # access count to trigger promotion
  promote_window_hours: 24.0         # time window for access count tracking

# ── Memory Tier Thresholds (#64) ──
tier_thresholds:
  hot_retention_min: 0.40            # min retention to stay Hot (below → Warm)
  warm_retention_min: 0.15           # min retention to stay Warm (below → Cold)
  cold_idle_days: 30                 # idle days before Cold archiving
  ghost_revive_to_tier: "warm"       # tier assigned on Ghost Revival (hot|warm)
  auto_archive_interval_hours: 6.0   # interval for auto-archive scan

# ── Batch Vectorization ──
batch_vectorization:
  enabled: false                        # defer embedding to batch writes
  batch_size: 32                        # flush when >= this many pending
  flush_interval_seconds: 30.0          # flush after this many seconds idle
  journal_path: ""                      # SQLite WAL path for crash recovery (empty = no journal)

# ── Edge Decay (#54) ──
edge_decay:
  base_multiplier: 1.0               # global decay speed multiplier
  min_edge_weight: 0.02              # edges below this are evicted

# ── Self-Organization (#55) ──
self_org:
  merge_threshold: 0.88
  cluster_similarity: 0.55
  min_cluster_size: 3
  max_topics: 30

# ── Personality Model (#56) ──
personality:
  update_on_remember: true           # incremental ingest per anchor
  extract_on_sleep: true             # full extraction during sleep

# ── Goal Tree (#57) ──
goal_tree:
  detect_on_sleep: true              # scan for new goals during sleep
  propagate_on_sleep: true           # propagate sub-goal progress upward
  archive_stale_hours: 168.0         # archive goals idle for 7 days
  archive_achieved_hours: 720.0      # archive achieved goals after 30 days

# ── Retrieval Budget (S-5) ──
retrieval_budget:
  max_hops: 3                        # max BFS depth from seed nodes
  max_nodes: 24                      # max activated nodes per query
  max_tokens: 6000                   # max token budget for retrieved content

# ── Versioned Memory / Cognitive Trajectory (A-9) ──
versioned_memory:
  detect_on_sleep: true              # scan for belief evolution chains during sleep
  refine_threshold: 0.6              # word overlap ratio to consider as refinement
  max_trajectory_depth: 10           # max versions per belief chain

# ── Cluster Memory (A-10) ──
cluster_memory:
  min_cluster_size: 5                # minimum anchors to form a cluster
  max_clusters: 50                   # max cluster centroids
  route_top_k: 3                     # top clusters to route queries to

# ── Causal Edges (B-12) ──
causal_edges:
  min_confidence: 0.3                # minimum confidence for heuristic type inference
  max_chain_depth: 5                 # max depth for causal chain tracing
  min_chain_strength: 0.2            # minimum edge weight for chain traversal

# ── Episodic Memory (B-13) ──
episodic_memory:
  record_on_remember: true           # auto-record episode on each remember()
  auto_summarize_on_sleep: true      # summarize completed sessions during sleep
  max_episodes_per_session: 500      # cap episodes per session
  emotional_arc_window: 20           # episodes to consider for emotional arc

# ── Embedding Provider (v1.0.1 multi-source) ──
embedding:
  provider: local                     # local | openai | zhipu | mixed
  mixed:
    primary: openai
    fallback: local
    timeout: 8                        # seconds before failover
  openai:
    model: text-embedding-3-small     # or text-embedding-3-large
    api_key: ${OPENAI_API_KEY}
    base_url: ""                      # optional proxy URL
    dimensions: 512                   # only valid for text-embedding-3-* models
  local:
    model: all-MiniLM-L6-v2           # any sentence-transformers model
    device: cpu                       # cpu | cuda
    onnx: false                       # enable ONNX acceleration
  zhipu:
    model: embedding-2
    api_key: ${ZHIPU_API_KEY}
    max_concurrent: 3                 # semaphore limit for API rate limits

# ── Feature Flags (v1.0.1 extras) ──
extras:
  resonance: true
  autobiography: true
  streaming: true
  benchmark: false
  mcp_server: false
  symbolic_filter: true

# ═══════════════════════════════════════════════════════
# Phase 5 — Cognitive Depth Optimization (2026-05-22)
# ═══════════════════════════════════════════════════════

# ── Memory Budget (5.1.1) ──
memory_budget:
  total_anchors: 50000
  working_memory: 200
  episodic: 30000
  semantic: 15000
  core_identity: 5000
  enforce_on_remember: true
  eviction_policy: lowest_quality   # lowest_quality | oldest | coldest

# ── Token Budget (5.1.1) ──
token_budget:
  per_recall_max_tokens: 4000
  daily_llm_call_limit: 100
  prompt_injection_max_chars: 8000
  truncation_strategy: importance_desc  # importance_desc | recency_desc | hybrid

# ── Memory Quality Score (5.1.2) ──
quality_score:
  weights:
    usage: 0.25
    reasoning: 0.25
    feedback: 0.15
    task_hit: 0.15
    freshness: 0.10
    coherence: 0.10
  prune_threshold: 0.2
  max_age_days: 30

# ── Long-Term Stability Control (5.1.3) ──
stability:
  decay_curve: exponential           # exponential | linear | custom
  exponential_lambda: 0.01
  linear_rate: 0.001
  core_identity_exempt: true
  protected_tags_exempt: true
  importance_threshold_exempt: 0.9
  decay_report_interval: 100
  max_decay_per_cycle: 0.3
  archive_threshold: 0.1
  delete_threshold: 0.01

# ── Cognitive Priority Layer (5.4.3) ──
cognitive_priority:
  active_goal_ttl_seconds: 3600
  long_term_goal_ttl_seconds: 604800
  core_identity_protected: true
  core_identity_forced_inject: true
  frequent_knowledge_threshold_access: 10

# ── Four-Layer Memory Pyramid (5.2.1) ──
memory_layers:
  working:
    ttl_seconds: 3600
    max_items: 200
    decay_rate: 1.0
    protection_level: 0
    recall_strategy: full_inject
    compression_strategy: none
  episodic:
    ttl_seconds: 2592000
    max_items: 30000
    decay_rate: 0.1
    protection_level: 0
    recall_strategy: semantic_search
    compression_strategy: summarize
  semantic:
    ttl_seconds: 31536000
    max_items: 15000
    decay_rate: 0.01
    protection_level: 1
    recall_strategy: graph_traversal
    compression_strategy: recursive_summarize
  core_identity:
    ttl_seconds: 0                    # infinite
    max_items: 5000
    decay_rate: 0.0
    protection_level: 3
    recall_strategy: force_inject
    compression_strategy: manual_only

# ── Typed Memory (5.2.3) ──
typed_memory:
  code:
    retrieval_priority: 7
    max_retention_days: 0             # infinite
    mergeable: false
  task:
    retrieval_priority: 10
    max_retention_days: 90
    mergeable: true
  dialogue:
    retrieval_priority: 5
    max_retention_days: 365
    mergeable: true
  tool_call:
    retrieval_priority: 6
    max_retention_days: 30
    mergeable: true
  knowledge:
    retrieval_priority: 8
    max_retention_days: 0             # infinite
    mergeable: true
  event:
    retrieval_priority: 4
    max_retention_days: 365
    mergeable: false
  preference:
    retrieval_priority: 9
    max_retention_days: 0             # infinite
    mergeable: true

# ── Abstraction Chain (5.2.2) ──
abstraction_chain:
  summary_trigger: 100
  pattern_trigger: 10
  identity_trigger: 5
  min_confidence: 0.6
  llm_enabled: false
  topic_similarity_threshold: 0.7

# ── Domain-based Graph (5.2.4) ──
domain_graph:
  cross_domain_edge_weight: 0.3
  soft_isolation: true
  auto_classify: true
  max_domains_per_anchor: 2

# ── Context Routing Engine (5.3.1) ──
context_routing:
  default_weights:
    similarity: 0.30
    task_relevance: 0.25
    domain_match: 0.15
    recency: 0.15
    user_intent: 0.10
    agent_state: 0.05

# ── Hebbian Edge Learning (5.3.2) ──
hebbian_learning:
  learning_rate: 0.01
  decay_rate: 0.001
  reinforcement_threshold: 3
  max_edge_weight: 1.0
  min_edge_weight: 0.01
  prune_threshold: 0.01
  cooccurrence_window_seconds: 300.0
  max_edges_per_node: 50

# ── Agent State Memory (5.4.1) ──
agent_state:
  persist_to_graph: true
  max_goals: 50
  max_tool_history: 200
  max_checkpoints: 10

# ── Cognitive Closure (5.4.2) ──
cognitive_closure:
  reflection_interval: 10
  min_memories_for_reflection: 100
  correction_threshold: 0.3
  reinforcement_threshold: 0.7
  llm_enabled: false
  auto_correct: true
  max_corrections_per_cycle: 10

# ═══════════════════════════════════════════════════════
# Phase 6 — Cognitive Cortex (2026-05-22)
# ═══════════════════════════════════════════════════════

# ── Perception Layer (6.1) ──
perception:
  intent_confidence_threshold: 0.5
  emotion_lexicon: nrc
  concept_max_count: 10
  implicit_need_max_count: 5
  urgency_keywords_weight: 0.4
  urgency_emotion_weight: 0.6
  max_text_length: 8000
  enable_entity_linking: true
  domain_classification_enabled: true

# ── Cognitive Workspace (6.2) ──
cognitive_workspace:
  max_items: 20
  default_ttl_seconds: 300.0
  decay_lambda_high_priority: 0.001
  decay_lambda_medium_priority: 0.01
  decay_lambda_low_priority: 0.05
  focus_boost_factor: 1.5
  diffusion_decay_per_hop: 0.3
  max_reasoning_chains: 5
  max_steps_per_chain: 20
  conflict_detection_threshold: 0.7
  auto_evict_on_overflow: true
  eviction_policy: lowest_activation

# ── Concept Cortex (6.3) ──
concept_cortex:
  max_concepts: 500
  min_evidence_for_concept: 2
  activation_decay_rate: 0.01
  baseline_activation: 0.1
  activation_threshold: 0.2
  spread_steps: 2
  spread_decay: 0.5
  merge_similarity_threshold: 0.85
  min_anchors_per_concept: 1
  max_anchors_per_concept: 1000
  auto_prune_interval: 100
  seed_concepts_enabled: true

# ── Activation Engine (6.4) ──
activation_engine:
  default_max_depth: 3
  default_max_nodes: 50
  default_decay: 0.6
  min_activation_energy: 0.05
  max_paths: 5
  min_path_length: 2
  path_confidence_threshold: 0.3
  concept_seed_energy: 0.7
  goal_seed_energy: 0.8
  emotion_seed_energy: 0.5
  query_seed_energy: 0.9
  lateral_inhibition_radius: 0.7
  lateral_inhibition_strength: 0.3
  edge_type_weights:
    causal: 1.5
    semantic_similarity: 1.2
    temporal_cooccurrence: 1.0
    contradiction: 0.5
    hierarchy: 0.8
    association: 0.7

# ── Goal System (6.5) ──
goal_system:
  max_goals: 100
  max_active_goals: 10
  max_sub_goals_per_goal: 10
  auto_detect_from_perception: true
  auto_decompose_complex_goals: true
  conflict_check_interval: 50
  progress_decay_rate: 0.01
  abandon_stale_days: 90
  archive_achieved_days: 30
  emotional_drive_weight: 0.3
  deadline_weight: 0.2

# ── Salience Engine (6.6) ──
salience:
  component_weights:
    task_relevance: 0.25
    goal_alignment: 0.20
    emotional_intensity: 0.10
    novelty: 0.10
    recency: 0.10
    urgency: 0.10
    frequency: 0.05
    cognitive_priority: 0.05
    social_relevance: 0.03
    contradiction_flag: 0.02
  max_attention_slots: 10
  attention_decay_rate: 0.05
  focus_boost_factor: 2.0
  cognitive_load_warning: 0.8
  cognitive_load_critical: 0.95
  inhibition_radius: 0.7
  inhibition_strength: 0.3
  shift_hysteresis: 0.15
  min_salience_for_admission: 0.15

# ── Cognitive Compression (6.7) ──
cognitive_compression:
  min_cluster_size: 3
  similarity_threshold: 0.55
  max_source_anchors_per_summary: 30
  summary_confidence_threshold: 0.4
  concept_min_summaries: 3
  pattern_min_concepts: 3
  trait_min_patterns: 2
  world_model_min_evidence: 5
  world_model_confidence_threshold: 0.3
  auto_prune_interval: 10
  redundancy_cosine_threshold: 0.9
  incremental_batch_size: 50
  stages_enabled:
    event_cluster: true
    summarize: true
    concept_extract: true
    pattern_detect: true
    trait_update: true
    world_model: true
    prune_redundant: true

# ── Self Model (6.8) ──
self_model:
  update_interval_seconds: 30.0
  max_uncertainties: 10
  max_biases: 5
  max_active_concepts: 8
  emotional_smoothing_factor: 0.3
  max_prompt_tokens: 2000
  prompt_format: compact
  include_memory_health: true
  include_bias_warnings: true
  persist_state_history: true
  max_state_history: 100
  bias_detection:
    recency_window_seconds: 3600
    confirmation_similarity_threshold: 0.8
    anchoring_age_threshold: 86400

# ── Autonomous Reasoning Loop (6.9) ──
autonomous_reasoning:
  enabled: false
  max_iterations_per_run: 5
  max_duration_seconds: 30.0
  min_trigger_severity: 0.5
  contradiction_threshold: 0.7
  uncertainty_spike_threshold: 0.3
  goal_blocked_severity: 0.6
  evidence_search_depth: 2
  evidence_min_count: 3
  resolution_confidence_threshold: 0.6
  auto_update_beliefs: true
  auto_decompose_goals: true
  trace_retention: 50

# ── Memory Lifecycle (6.10) ──
memory_lifecycle:
  stage_policies:
    working:
      max_items: 200
      ttl_seconds: 3600
      promote_to: short_term
      promote_condition: "importance > 0.3"
    short_term:
      max_items: 3000
      ttl_seconds: 604800
      promote_to: long_term
      promote_condition: "access_count >= 3 OR stability > 0.5"
      demote_to: archived
      demote_condition: "idle_seconds > 259200 AND access_count < 2"
    long_term:
      max_items: 30000
      ttl_seconds: 0
      promote_to: consolidated
      promote_condition: "stability > 0.7 AND access_count >= 10"
      demote_to: archived
      demote_condition: "idle_seconds > 2592000"
    consolidated:
      max_items: 15000
      ttl_seconds: 0
      demote_to: archived
      demote_condition: "idle_seconds > 7776000"
    archived:
      max_items: 50000
      ttl_seconds: 0
      demote_to: dormant
      demote_condition: "idle_seconds > 15552000"
    dormant:
      max_items: 0
      demote_to: ghost
      demote_condition: "retention < 0.05"
    ghost:
      max_items: 0
      purge_after_days: 90
  auto_transition_interval_hours: 6.0
  max_transitions_per_cycle: 1000

# ── Phase 7: Memory Evolution ────────────────────────────

importance_engine:
  weights:
    emotion: 0.25
    repetition: 0.30
    goal: 0.20
    novelty: 0.15
    future: 0.10
  thresholds:
    discard: 0.2
    low: 0.5
    normal: 0.8
    core: 1.0
  decay_rates:
    discard: 1.0
    low: 0.3
    normal: 0.1
    core: 0.02

belief_system:
  initial_strength: 0.5
  reinforce_amount: 0.05
  challenge_amount: 0.1
  stability_increment: 0.015
  min_strength_for_stable: 0.7
  min_stability_for_stable: 0.8
  max_beliefs: 500

personality_formation:
  profile:
    snapshot_interval_interactions: 50
    max_snapshots: 100
    max_patterns: 50
    max_identity_markers: 20
  evolution:
    recent_window_days: 7
    emerging_threshold: 3
    fading_threshold_months: 3
    stable_core_min_frequency: 5

cognitive_identity:
  persistence:
    storage_dir: "~/.nwc/identity"
    autosave: true
    autosave_interval_interactions: 50
  snapshot:
    max_snapshots: 100
    max_milestones: 50
