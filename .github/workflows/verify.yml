name: Verify (build + smoke)

# Final verification only: never triggered by pull_request events.
# Run manually (Actions -> Verify -> Run workflow) or by pushing a v* tag.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build wheel + smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import tomllib

          tag = os.environ["TAG_NAME"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != f"v{version}":
              print(
                  f"::error::tag {tag!r} does not match pyproject version {version!r} "
                  f"(expected 'v{version}')",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"PASS: tag {tag} matches pyproject version {version}")
          PY

      # Single build: smoke_test.sh builds the wheel, installs it into a
      # throwaway venv outside the repo and runs the smoke checks.
      - name: Build wheel + smoke tests
        run: bash scripts/smoke_test.sh
