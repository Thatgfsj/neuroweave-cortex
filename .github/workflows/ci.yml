name: CI

# Thin pull_request entry point. It delegates to the reusable pr-check.yml
# workflow, which runs metadata/size/version/line-budget/syntax checks only.
# Building and smoke tests live in verify.yml (workflow_dispatch + v* tags).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: PR checks
    uses: ./.github/workflows/pr-check.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
