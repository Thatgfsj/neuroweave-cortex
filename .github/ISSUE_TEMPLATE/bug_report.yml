name: 🐛 Bug 报告
description: 报告可复现的缺陷（现象 / 复现 / 期望 / 环境）
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈，提交前请先搜索是否已有相同 Issue。安全漏洞**不要**公开提交，请按 [SECURITY.md](https://github.com/Thatgfsj/neuroweave-cortex/blob/main/SECURITY.md) 私下报告。

  - type: textarea
    id: phenomenon
    attributes:
      label: 现象
      description: 发生了什么？贴完整报错堆栈或异常输出，不要只写"报错了"。
      placeholder: |
        调用 mgr.recall(...) 时返回空列表，但数据确实存在。
        Traceback:
          File "...", line ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 最小可复现代码或命令，越短越好；能稳定复现的片段请直接给出。
      placeholder: |
        1. pip install NWcortex==1.4.2
        2. 运行以下脚本
        3. 观察到 ...
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为正确的行为是什么？可引用 README 或 docs 中的描述。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 版本信息直接影响定位，请如实填写。
      value: |
        - NWC 版本（`python -c "import star_graph; print(star_graph.__version__)"`）：
        - Python 版本：
        - 操作系统：
        - 安装方式（pip / 源码 editable）：
        - 存储后端（内存 / SQLite / Qdrant）：
        - 相关依赖版本（numpy / scikit-learn 等）：
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 附加信息
      description: 日志、截图、数据规模、是否在干净环境复现过。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，未发现重复
          required: true
        - label: 我使用的是最新发布版本，或已说明为何无法升级
          required: true
