name: ✨ 功能请求
description: 提出新能力或行为改进（动机 / 方案 / 影响面）
title: "[feat] "
labels: ["feat"]
body:
  - type: markdown
    attributes:
      value: |
        功能请求请先说明**要解决的问题**，而不是只给方案。核心只做记忆 CRUD、图操作、检索、睡眠巩固；更高层认知特性应放 `contrib/` 或独立包。

  - type: textarea
    id: motivation
    attributes:
      label: 动机 / 问题
      description: 当前哪里不够用？谁在什么场景下会遇到？不改会怎样？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述你希望的行为（API 形态、配置项、默认值），不必写实现细节。
      placeholder: |
        mgr.recall(..., strategy="xxx") 返回 ...
        默认行为保持向后兼容。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过但放弃的做法及原因；是否可以用现有能力组合实现。
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 影响面
      description: 是否改动公开 API / 数据格式 / 默认配置？是否需要同步更新 README 与 docs？
      value: |
        - 公开 API / 数据格式兼容：
        - 默认配置 / 需要更新的文档：
        - 预计代码量（<1000 行？是否需要拆分）：
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 可验证的完成条件，修复 PR 将逐条对照。
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue / ROADMAP，未发现重复或已规划的同项
          required: true
        - label: 我理解该请求需要有人认领后才会进入实现（Issue-first）
          required: true
